for(let h=0;h<=23;h+=2){
  const x=X(h*4);
  const tx=document.createElementNS(svgNS,'text');
  tx.setAttribute('x',x); tx.setAttribute('y',H-12); tx.setAttribute('font-size',10); tx.setAttribute('fill','#888'); tx.setAttribute('text-anchor','middle');
  tx.textContent=(h<10?'0'+h:h)+':00'; svg.appendChild(tx);
}

let lineB, lineR, guide, dotB, dotR, curObj=null;
function draw(key){
  const obj = key==='__typical__'? DATA.typical : DATA.days[key];
  const b=obj.before, r=obj.realTime;
  if(lineB) lineB.remove(); if(lineR) lineR.remove();
  lineB=document.createElementNS(svgNS,'polyline');
  lineB.setAttribute('points', b.map((v,i)=>X(i)+','+Y(v)).join(' '));
  lineB.setAttribute('fill','none'); lineB.setAttribute('stroke','#e8542a'); lineB.setAttribute('stroke-width',2);
  svg.appendChild(lineB);
  lineR=document.createElementNS(svgNS,'polyline');
  lineR.setAttribute('points', r.map((v,i)=>X(i)+','+Y(v)).join(' '));
  lineR.setAttribute('fill','none'); lineR.setAttribute('stroke','#1f6fe0'); lineR.setAttribute('stroke-width',2);
  svg.appendChild(lineR);
  if(!guide){
    guide=document.createElementNS(svgNS,'line');
    guide.setAttribute('y1',M.t); guide.setAttribute('y2',M.t+ih); guide.setAttribute('stroke','#999'); guide.setAttribute('stroke-width',1); guide.setAttribute('display','none');
    svg.appendChild(guide);
    dotB=document.createElementNS(svgNS,'circle'); dotB.setAttribute('r',3.5); dotB.setAttribute('fill','#e8542a'); dotB.setAttribute('display','none'); svg.appendChild(dotB);
    dotR=document.createElementNS(svgNS,'circle'); dotR.setAttribute('r',3.5); dotR.setAttribute('fill','#1f6fe0'); dotR.setAttribute('display','none'); svg.appendChild(dotR);
  }
  guide.setAttribute('display','none'); dotB.setAttribute('display','none'); dotR.setAttribute('display','none');
  curObj=obj;
}
const wkEl=document.getElementById('wk');

// 下拉填充（预设 + 每日）
const sel=document.getElementById('sel');
const PRESETS = [{"v": "__typical__", "t": "典型日（31天均值）", "note": ""}, {"v": "07-12", "t": "最深负价日 07-12（实时日均 -56）", "note": " ※重点看负价带"}, {"v": "07-19", "t": "最高价日 07-19（日前日均 360）", "note": ""}];
PRESETS.forEach(p=>{
  const o=document.createElement('option'); o.value=p.v; o.textContent=p.t+(p.note||''); sel.appendChild(o);
});
Object.keys(DATA.days).sort().forEach(k=>{
  const o=document.createElement('option'); o.value=k; o.textContent=k+' '+DATA.days[k].wk; sel.appendChild(o);
});
sel.addEventListener('change',()=>{
  const k=sel.value;
  wkEl.textContent = k==='__typical__'? '（全月均值，已抹平单日波动）' : DATA.days[k].wk;
  draw(k);
});

// 悬停
const tip=document.getElementById('tooltip');
svg.addEventListener('mousemove',e=>{
  if(!curObj) return;
  const rect=svg.getBoundingClientRect();
  const mx=e.clientX-rect.left;
  let i=Math.round((mx-M.l)/iw*95);
  i=Math.max(0,Math.min(95,i));
  const hh=Math.floor(i/4), mm=(i%4)*15;
  const t=(hh<10?'0'+hh:hh)+':'+(mm<10?'0'+mm:mm);
  guide.setAttribute('x1',X(i)); guide.setAttribute('x2',X(i)); guide.setAttribute('display','');
  dotB.setAttribute('cx',X(i)); dotB.setAttribute('cy',Y(curObj.before[i])); dotB.setAttribute('display','');
  dotR.setAttribute('cx',X(i)); dotR.setAttribute('cy',Y(curObj.realTime[i])); dotR.setAttribute('display','');
  tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px';
  tip.innerHTML=`时刻 <b>${t}</b><br>日前：<b style="color:#ff9b7a">${curObj.before[i].toFixed(1)}</b><br>实时：<b style="color:#7ab0ff">${curObj.realTime[i].toFixed(1)}</b> 元/MWh`;
});
svg.addEventListener('mouseleave',()=>{ tip.style.display='none'; guide.setAttribute('display','none'); dotB.setAttribute('display','none'); dotR.setAttribute('display','none'); });

draw('__typical__');
</script>
</body>
</html>
